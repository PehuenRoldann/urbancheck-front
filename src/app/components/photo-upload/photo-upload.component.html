<div
  class="mb-3 border border-primary rounded p-3 text-center bg-light"
  (click)="openFileDialog($event)"
  role="button"
  tabindex="0"
>
  <ngx-file-drop
    [dropZoneLabel]="'Arrastrá imágenes o hacé clic para seleccionar'"
    (onFileDrop)="dropped($event)"
    [dropZoneClassName]="'w-100 h-100'"
  >
  </ngx-file-drop>

  <input
    #fileInput
    type="file"
    [attr.accept]="accept"
    [attr.capture]="capture || null"
    [attr.multiple]="multiple ? '' : null"
    (change)="onFileSelected($event)"
    hidden
  />
</div>
