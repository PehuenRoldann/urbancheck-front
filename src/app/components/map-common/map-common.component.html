
<div id="map-container">

    <div class="spinner-container" [ngStyle]="{'display': (mapStatus === 0) ? 'flex' : 'none'}">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <div [ngStyle]="{'visibility': (mapStatus === 1) ? 'visible' : 'hidden'}">
      <div id="map"></div>
    </div>
    <div [ngStyle]="{'visibility': (mapStatus === 2) ? 'visible' : 'hidden'}">
        <h1>There has been a problem with the map!!</h1>
    </div>


    <nav id="nav-bar">
        <span class="nav-button" (click)="openModal(modalIds[3])"
            ><img class="nav-btn-img" src="assets/images/Vectorperson.svg" alt=""
        /></span>
        <span class="nav-button"
            ><img class="nav-btn-img" src="assets/images/megaphone.svg" alt=""
        /></span>
        <span class="nav-button"
            ><img class="nav-btn-img" src="assets/images/notices-board.svg" alt=""
        /></span>
        <span 
            *ngIf="userData?.role!.id !== 2"
            class="nav-button"
            (click)="goToAdminPanel()"
            ><img class="nav-btn-img" src="assets/images/task-list-svgrepo-com.svg" alt=""
        /></span>
    </nav>
</div>

<!-- Modal -->
<div
    class="modal fade"
    id="newTicketConfModal"
    tabindex="-1"
    role="dialog"
    aria-labelledby="myModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="myModalLabel">
                    ¿Desea crear un ticket en esta ubicación?
                </h5>
            </div>
            <div class="modal-body">
                <p>Latitud: {{ currentCoorsd.lat }}</p>
                <p>Longitud: {{ currentCoorsd.lng }}</p>
            </div>
            <div class="modal-footer">
                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                    (click)="removeLastMark()"
                  >
                    Cerrar
                </button>
                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-dismiss="modal"
                    (click)="openModal(modalIds[1])"
                >
                    Confirmar!
                </button>
            </div>
        </div>
    </div>
</div>


<app-ticket-creation-modal [modalId]="modalIds[1]" (cancelTicket)="removeLastMark($event)" (ticketCreated)="onTicketCreated($event)"/>

<app-ticket-view-modal [modalId]="modalIds[2]"/>

<app-profile-modal [modalId]="modalIds[3]" />
